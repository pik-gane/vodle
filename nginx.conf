# vodle — nginx configuration for production
#
# Serves the Angular SPA and reverse-proxies Matrix API requests
# to the Synapse homeserver on the internal Docker network.

# Conditionally set Connection header for WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- SPA routing ----------
    # Angular uses hash-based routing (#/route), but also try
    # HTML5 pushState routes by falling back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Matrix API reverse proxy ----------
    # Forward /_matrix/* requests to the Synapse homeserver.
    # This lets the browser talk to Matrix on the same origin,
    # avoiding CORS issues.
    location /_matrix/ {
        proxy_pass http://synapse:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Matrix sync
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-polling timeout for Matrix sync (default 30s + buffer)
        proxy_read_timeout 120s;
    }

    # ---------- Matrix well-known ----------
    # Required for Matrix server discovery
    location /.well-known/matrix/ {
        proxy_pass http://synapse:8008;
        proxy_set_header Host $host;
    }

    # ---------- Static asset caching ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell is the one file that is not content-hashed, and it names the
    # hashed chunks of the build it came from. A browser that keeps a cached
    # copy across a redeployment asks for chunks this server no longer has,
    # and the app dies with a ChunkLoadError on the first lazy route. So it
    # is revalidated on every load (a 304 when nothing changed), while the
    # hashed files above stay immutable for a year.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets that are NOT content-hashed: the translations, the poll-type
    # icons' data and anything else under assets/ that keeps its name across
    # releases. A browser that cached one before a deployment would go on
    # serving it afterwards — a translation added in the new release then
    # renders as its raw key ("mypolls.archived") — so these revalidate like
    # the shell above (#327).
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }

    # The crypto WASM is 5.4 MB and, like the translations, keeps its name
    # across releases — so it revalidates rather than being immutable for a
    # year, which makes a repeat load a 304 instead of five megabytes, and
    # an SDK upgrade that ships a different binary under the same name still
    # reaches the browser (#327).
    location ~* \.wasm$ {
        add_header Cache-Control "no-cache";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;
}
