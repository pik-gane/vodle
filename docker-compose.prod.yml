# vodle — production deployment stack (see deploy/README.md)
#
#   vodle-web   nginx serving the built app, forwarding /_matrix/ to Synapse
#   synapse     the Matrix homeserver, on the internal network only
#   postgres    its database
#   guard-bot   closes polls at their deadline, lets participants into the
#               closed poll rooms, removes rooms after the retention period
#
# Settings come from .env (deploy/generate-secrets.sh) and from
# src/environments/environment.prod.ts (matrix.server_name, copied into .env
# as SERVER_NAME by deploy/deploy.sh, which runs this stack). With TLS
# certificate files on the host, add docker-compose.tls.yml:
#
#   docker compose --env-file .env -f docker-compose.prod.yml -f docker-compose.tls.yml up --build -d

services:
  vodle-web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # built into the app: the token the homeserver requires to register (#327)
        REGISTRATION_TOKEN: "${REGISTRATION_TOKEN:-}"
    container_name: vodle-web-prod
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    volumes:
      # the privacy statement and the imprint, served as /site/... (deploy/deploy.sh)
      - ./deploy/site:/usr/share/nginx/html/site:ro
    depends_on:
      synapse:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vodle-net

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: vodle-matrix-synapse
    # not published to the host: all Matrix traffic goes through the web container
    volumes:
      - ./matrix-data:/data
    environment:
      - "SYNAPSE_SERVER_NAME=${SERVER_NAME:?SERVER_NAME missing in .env (deploy/deploy.sh up writes it)}"
      - SYNAPSE_REPORT_STATS=no
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    command: run
    networks:
      - vodle-net

  postgres:
    image: postgres:16-alpine
    container_name: vodle-postgres
    environment:
      - POSTGRES_USER=synapse
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env (deploy/generate-secrets.sh writes it)}"
      - POSTGRES_DB=synapse
      # Synapse needs the C locale for its database
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - vodle-net

  guard-bot:
    build:
      context: ./guard-bot
      dockerfile: Dockerfile
    container_name: vodle-guard-bot
    environment:
      - MATRIX_HOMESERVER_URL=http://synapse:8008
      - "BOT_USER=@${BOT_LOCALPART:-vodle-guard}:${SERVER_NAME:?SERVER_NAME missing in .env (deploy/deploy.sh up writes it)}"
      - "BOT_PASSWORD=${BOT_PASSWORD:?BOT_PASSWORD missing in .env (deploy/generate-secrets.sh writes it)}"
      - SCAN_INTERVAL_MS=30000
      # close a room only this long after its deadline, and only once no
      # event has arrived in it for QUIET_PERIOD_MS (see guard-bot/index.js):
      - CLOSE_GRACE_MS=10000
      - QUIET_PERIOD_MS=5000
      # a poll's rooms are removed this many days after its deadline (#331);
      # ADMIN_PURGE needs the bot registered as an admin (deploy/deploy.sh does):
      - RETENTION_DAYS=${RETENTION_DAYS:-365}
      - ADMIN_PURGE=true
      # GET /healthz for the healthcheck below and for monitoring (#327):
      - HEALTH_PORT=8012
    depends_on:
      synapse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8012/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - vodle-net

networks:
  vodle-net:
    driver: bridge
