# Builds the app and runs the test suite on every pull request and every push
# to main. Until this workflow existed, nothing ran the tests in CI, so every
# "the suite passes" claim rested on someone's local run.
#
# The job fails on failures that are NOT in test/known-failing-specs.txt.
# That file is currently empty (the 27 TestBed dependency-injection failures
# it was introduced for were fixed on 2026-09-09), so in effect a green suite
# is required; the baseline mechanism stays in place so that a deliberately
# accepted failure can be recorded explicitly instead of being normalized.
name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# a new push to a pull request makes the previous run pointless:
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # the two-client integration specs need a real CouchDB running the real
      # validator; scripts/test-couchdb.sh provisions this container below.
      # Without it those specs skip themselves and the rest still runs.
      couchdb:
        image: couchdb:3.3
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: admin
        ports:
          - 5984:5984

    env:
      KARMA_RESULT_FILE: karma-results.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts because @ionic/app-scripts still pulls in node-sass
      # 4.x, whose native build fails on any current Node; nothing in the
      # Angular build uses it (see NODE_SASS_FIX.md). --legacy-peer-deps
      # matches the documented local install in INSTALL.md.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Resolve a headless browser
        run: |
          for candidate in "$CHROME_BIN" google-chrome chromium-browser chromium; do
            if [ -n "$candidate" ] && command -v "$candidate" > /dev/null 2>&1; then
              echo "CHROME_BIN=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no Chrome or Chromium found on the runner" >&2
          exit 1

      - name: Provision the test CouchDB
        run: scripts/test-couchdb.sh provision

      # the Matrix two-client and federation integration specs need real
      # Synapse homeservers (two, federating with each other); without them
      # they skip themselves, which --no-skips below would flag:
      - name: Provision the two federating test Matrix homeservers
        run: scripts/test-matrix.sh start

      - name: Build
        run: npm run build

      - name: Test
        # the runner's browser needs --no-sandbox; see karma.conf.js.
        # A non-zero exit here only means "some spec failed"; whether that is
        # acceptable is decided by the baseline check below, so do not let it
        # end the job before that check has run.
        continue-on-error: true
        run: npx ng test --browsers=ChromeHeadlessNoSandbox --watch=false

      - name: Compare against the known-failure baseline
        # --no-skips because CouchDB was provisioned above: if the integration
        # specs skip themselves here, they have silently stopped running.
        run: node scripts/check-test-results.js --no-skips

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karma-results
          path: |
            karma-results.json
            /tmp/vodle-test-guard-bot.log
          if-no-files-found: warn

  e2e-smoke:
    name: e2e smoke (built app)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Resolve a headless browser
        run: |
          for candidate in "$CHROME_BIN" google-chrome chromium-browser chromium; do
            if [ -n "$candidate" ] && command -v "$candidate" > /dev/null 2>&1; then
              echo "CHROME_BIN=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no Chrome or Chromium found on the runner" >&2
          exit 1

      - name: Build
        run: npm run build

      # drives the REAL built app (docs/) through the first-run flow over the
      # DevTools protocol; see test/wdio.conf.js:
      - name: E2E smoke
        run: npm run e2e

      # a failed e2e run is otherwise just a timeout message in the log:
      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore
