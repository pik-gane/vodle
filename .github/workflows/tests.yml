# Builds the app and runs the test suite on every pull request and every push
# to main. Until this workflow existed, nothing ran the tests in CI, so every
# "the suite passes" claim rested on someone's local run.
#
# The job fails on failures that are NOT in test/known-failing-specs.txt.
# That file is currently empty (the 27 TestBed dependency-injection failures
# it was introduced for were fixed on 2026-09-09), so in effect a green suite
# is required; the baseline mechanism stays in place so that a deliberately
# accepted failure can be recorded explicitly instead of being normalized.
name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# a new push to a pull request makes the previous run pointless:
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # the two-client integration specs need a real CouchDB running the real
      # validator; scripts/test-couchdb.sh provisions this container below.
      # Without it those specs skip themselves and the rest still runs.
      couchdb:
        image: couchdb:3.3
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: admin
        ports:
          - 5984:5984

    env:
      KARMA_RESULT_FILE: karma-results.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts because @ionic/app-scripts still pulls in node-sass
      # 4.x, whose native build fails on any current Node; nothing in the
      # Angular build uses it (see NODE_SASS_FIX.md). --legacy-peer-deps
      # matches the documented local install in INSTALL.md.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Resolve a headless browser
        run: |
          for candidate in "$CHROME_BIN" google-chrome chromium-browser chromium; do
            if [ -n "$candidate" ] && command -v "$candidate" > /dev/null 2>&1; then
              echo "CHROME_BIN=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no Chrome or Chromium found on the runner" >&2
          exit 1

      # the guard bot's pure logic (the repair of state that resolution
      # dropped at a close, #334) has node:test unit tests of its own:
      - name: Guard bot unit tests
        run: node --test guard-bot/recheck.test.js

      # English is the fallback language, so a key missing there renders as
      # itself — a heading reading "mypolls.archived" (#327):
      - name: Every translation key a template asks for exists in English
        run: node scripts/check-i18n-keys.js

      - name: Provision the test CouchDB
        run: scripts/test-couchdb.sh provision

      # the Matrix two-client and federation integration specs need real
      # Synapse homeservers (two, federating with each other); without them
      # they skip themselves, which --no-skips below would flag:
      - name: Provision the two federating test Matrix homeservers
        run: scripts/test-matrix.sh start

      # Builds the production configuration — what a deployment builds
      # (Dockerfile.prod), and the only one that type-checks the templates,
      # since it turns on AOT and tsconfig.json has strictTemplates — then
      # serves it at its own origin with /_matrix/ forwarded to the
      # homeserver above and drives it through a real browser: register,
      # publish a poll, join it from a fresh profile by magic link, vote,
      # and check that both sides count the same voters. Five defects
      # reached the first real deployment through the gap between this
      # configuration and the one the rest of the suite uses (#327).
      # the boot-log parser the click-through gates on, checked against the
      # real console log that found the crypto-store defect (#327)
      - name: Check the boot-stage parser
        run: node scripts/boot-stages.js --self-test

      # and the digest that makes a failed click-through readable: the run of
      # 2026-09-12 printed 300 KB of console dump with the one line naming
      # the failure buried in it (#327)
      - name: Check the click-through report helpers
        run: node scripts/clickthrough-report.js --self-test

      - name: Build and click through the production app
        # with simulated voters, so the poll is published as a burst of
        # writes across several rooms and both sides have to agree on how
        # many voters there are — one client writing for ten is what a poll
        # of fifty does to a homeserver in miniature (#327)
        run: VODLE_SIMULATED_VOTERS=8 scripts/production-clickthrough.sh

      - name: Test
        # the runner's browser needs --no-sandbox; see karma.conf.js.
        # A non-zero exit here only means "some spec failed"; whether that is
        # acceptable is decided by the baseline check below, so do not let it
        # end the job before that check has run.
        continue-on-error: true
        run: npx ng test --browsers=ChromeHeadlessNoSandbox --watch=false

      - name: Compare against the known-failure baseline
        # --no-skips because CouchDB was provisioned above: if the integration
        # specs skip themselves here, they have silently stopped running.
        run: node scripts/check-test-results.js --no-skips

      - name: Upload the click-through screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-clickthrough-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karma-results
          path: |
            karma-results.json
            /tmp/vodle-test-guard-bot.log
          if-no-files-found: warn

  e2e-smoke:
    name: e2e smoke (built app)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Resolve a headless browser
        run: |
          for candidate in "$CHROME_BIN" google-chrome chromium-browser chromium; do
            if [ -n "$candidate" ] && command -v "$candidate" > /dev/null 2>&1; then
              echo "CHROME_BIN=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no Chrome or Chromium found on the runner" >&2
          exit 1

      - name: Build
        run: npm run build

      # drives the REAL built app (docs/) through the first-run flow over the
      # DevTools protocol; see test/wdio.conf.js:
      - name: E2E smoke
        run: npm run e2e

      # a failed e2e run is otherwise just a timeout message in the log:
      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore
