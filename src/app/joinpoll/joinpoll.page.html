<ion-header>
  <ion-toolbar style="padding-right:11px;">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title [innerHtml]="'joinpoll.-page-title'|translate"></ion-title>
    <ion-buttons slot="end">

      <!-- OFFLINE SIGN -->
      <ng-container *ngIf="!window.navigator.onLine">
        <ion-icon name="cloud-offline-outline" color="grey"
          style="position: relative; bottom: -1px;">
        </ion-icon>
        <ion-icon name="alert-outline" color="grey">
        </ion-icon>
      </ng-container> 

      <!-- SYNCING SIGN -->
      <ion-spinner *ngIf="window.navigator.onLine && !ready" name="crescent" color="grey"></ion-spinner>

    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- FIRST VISIT WITHOUT CREDENTIALS (#193): take part as a guest, or log in -->

<ion-content *ngIf="guest_login_pending && !ready && !join_error" data-vodle="join-poll-guest-page">
  <ion-grid>
    <ion-item class="item-text-wrap" lines="none">
      <ion-col>
        <h1 class="ion-text-center" style="width:100%;" [innerHtml]="'joinpoll.guest-welcome'|translate"></h1>
        <p class="ion-text-center" style="width:100%;" [innerHtml]="'joinpoll.guest-intro'|translate"></p>
      </ion-col>
    </ion-item>
    <ng-container *ngIf="E.privacy_statement_url">
      <ion-item lines="none" class="item-text-wrap">
        <ion-checkbox slot="start" [(ngModel)]="accept_privacy" data-vodle="accept-privacy-checkbox"></ion-checkbox>
        <small><p>
          <span [innerHtml]="'login.consent-privacy-before-privacy'|translate"></span><a target="_blank" [href]="E.privacy_statement_url" [innerHtml]="'login.consent-privacy-privacy'|translate"></a><span [innerHtml]="'login.consent-privacy-after-privacy'|translate"></span>
        </p></small>
      </ion-item>
    </ng-container>
    <ion-item lines="none">
      <ion-button size="large" color="primary" slot="end" shape="round"
          [disabled]="!accept_privacy" data-vodle="take-part-as-guest-button"
          (click)="take_part_as_guest()">
        <span [innerHtml]="'joinpoll.take-part-as-guest-button'|translate"></span>
        &nbsp;<ion-icon name="arrow-forward-outline"></ion-icon>
      </ion-button>
    </ion-item>
    <ion-item class="item-text-wrap" lines="none">
      <small><p style="width:100%;">
        <span [innerHtml]="'joinpoll.have-account'|translate"></span><br/>
        <ion-button color="primary" fill="outline" shape="round" data-vodle="join-login-button"
            (click)="go_to_login()">
          <span [innerHtml]="'joinpoll.login-button'|translate"></span>
        </ion-button>
      </p></small>
    </ion-item>
  </ion-grid>
</ion-content>

<ion-content *ngIf="!guest_login_pending && !ready && !join_error">
  <ion-item class="ion-text-center" lines="none">
    <h3>
      <i [innerHtml]="'joinpoll.fetching'|translate"></i>&nbsp;
    </h3>
  </ion-item>
  <ion-item class="ion-text-center" lines="none">
    <h1>
      <ion-spinner name="crescent" size="large"></ion-spinner>
    </h1>
  </ion-item>
</ion-content>

<ion-content *ngIf="join_error" data-vodle="join-poll-error">
  <ion-item class="ion-text-center" color="danger" lines="none">
    <ion-col>
      <h3>Failed to join this poll</h3>
      <p>{{ join_error }}</p>
      <p><small>The invite link may be invalid or the poll may no longer exist. Please ask the poll creator for a new link.</small></p>
      <p><small><i>joinpoll v5</i></small></p>
    </ion-col>
  </ion-item>
</ion-content>

<ion-content *ngIf="ready && !p">
  <ion-item class="ion-text-center" lines="none">
    <h3>
      <i [innerHtml]="'joinpoll.initializing'|translate"></i>&nbsp;
    </h3>
  </ion-item>
  <ion-item class="ion-text-center" lines="none">
    <h1>
      <ion-spinner name="crescent" size="large"></ion-spinner>
    </h1>
  </ion-item>
</ion-content>

<ion-content *ngIf="ready && (p!=null)" data-vodle="join-poll-page">
  <ion-item class="ion-text-center" color="warning">
    <ion-col class="ion-no-padding ion-no-margin">
      <h4 [innerHtml]="'joinpoll.header'|translate:{poll_title:p.title}"></h4>
      <p [innerHtml]="(p.type=='winner'?'joinpoll.p1-winner':'joinpoll.p1-share')|translate:{due:p.due_string}"></p>
    </ion-col>
  </ion-item>
  <ion-item class="ion-text-center" color="secondary">
    <ion-col class="ion-no-padding ion-no-margin">
      <p [innerHtml]="'joinpoll.p2'|translate"></p>
    </ion-col>
  </ion-item>
  <ion-item class="ion-text-center" color="primary">
    <ion-col class="ion-no-padding ion-no-margin">
      <p [innerHtml]="'joinpoll.p3'|translate"></p>
    </ion-col>
  </ion-item>
  <ion-item class="ion-text-center" color="light">
    <ion-col class="ion-no-padding ion-no-margin">
      <small>
        <p [innerHtml]="'joinpoll.p4'|translate"></p>
      </small>
    </ion-col>
  </ion-item>
  <ion-item class="ion-text-center" lines="none">
    <ion-col class="ion-no-padding ion-no-margin">
      <small>
        <p [innerHtml]="'joinpoll.p5'|translate"></p>
      </small>
    </ion-col>
  </ion-item>
  <ion-item class="ion-text-center" lines="none">
    <ion-col class="ion-no-padding ion-no-margin">
      <ion-button size="large" fill="solid" color="primary" 
          shape="round" type="submit" data-vodle="join-poll-go-button"
          (click)="go_button_clicked()">
        <span [innerHtml]="'joinpoll.lets-go-button'|translate"></span>&nbsp;
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </ion-button>
    </ion-col>
  </ion-item>
  <ion-item class="ion-text-center" lines="none">
    <ion-col class="ion-no-padding ion-no-margin">
      <small>
        <p [innerHtml]="'joinpoll.p6'|translate:{link_start:help_link_start,link_end:help_link_end}"></p>
      </small>
    </ion-col>
  </ion-item>
</ion-content>
