# >>> vodle deployment settings (deploy/deploy.sh regenerates this block; edit deploy/homeserver.vodle.yaml instead)
# Appended to the homeserver.yaml that `synapse generate` wrote; a key given
# again here replaces the generated one (Synapse takes the last occurrence).
# The same settings, with the reasons, are in documentation/deployment/MATRIX.md.

# the app and the homeserver share the origin: nginx forwards /_matrix/ and
# /.well-known/matrix/ to Synapse. PUBLIC_ORIGIN (.env) is where browsers
# reach that origin — the server name over https unless the deployment sits
# on another port or under another name (deploy/README.md).
public_baseurl: __PUBLIC_ORIGIN__/
# /.well-known/matrix/server for other homeservers (federation over 443)
serve_server_wellknown: true

# PostgreSQL (the postgres service of docker-compose.prod.yml)
database:
  name: psycopg2
  args:
    user: synapse
    password: "__POSTGRES_PASSWORD__"
    database: synapse
    host: postgres
    port: 5432
    cp_min: 5
    cp_max: 10

# registration (#327): vodle registers a Matrix account per user on first
# use, so registration is open — but only with the token the app carries
enable_registration: true
registration_requires_token: true
suppress_key_server_warning: true
report_stats: false

# vodle sends no media and needs no presence
max_upload_size: 1M
presence:
  enabled: false

# rate limits: Synapse's defaults are far below what vodle does when a poll
# starts (one room per voter, every participant joining every voter room,
# bursts of state events); these run the whole test suite without a 429
rc_login:
  address: {per_second: 1, burst_count: 20}
  account: {per_second: 1, burst_count: 20}
  failed_attempts: {per_second: 0.5, burst_count: 10}
rc_registration: {per_second: 0.5, burst_count: 20}
rc_registration_token_validity: {per_second: 1, burst_count: 20}
# Every vodle write is a state event, and publishing a poll writes a burst
# of them: one vid, one deadline and one rating PER OPTION in each voter's
# room, plus one announcement each. A test poll of 50 voters over 5 options
# is around 400 events in a few seconds. At burst 100 the rest are refused,
# and a refused rating used to be dropped (fixed), so the burst has to fit.
rc_message: {per_second: 20, burst_count: 1000}
# room creation: Synapse's default is a burst of 10 and then ONE ROOM PER
# 62 SECONDS (per_second 0.016), which vodle blows through at the start of
# any poll — it creates one room per voter. A poll of 50 then materialises
# over the best part of an hour, and until it has, a newcomer sees only the
# voters whose rooms exist, while the creator counts the ones it holds
# locally. Found on the first production poll (#327).
rc_room_creation: {per_second: 5, burst_count: 100}
rc_joins:
  local: {per_second: 5, burst_count: 100}
  remote: {per_second: 2, burst_count: 50}
rc_joins_per_room: {per_second: 5, burst_count: 100}
rc_invites:
  per_room: {per_second: 2, burst_count: 50}
  per_user: {per_second: 2, burst_count: 50}
  per_issuer: {per_second: 5, burst_count: 200}

# federation: after a network split Synapse retries a partner only every ten
# minutes by default; seconds keep a split short for the voters (#329).
# FEDERATION=off in .env closes the homeserver to other homeservers
# entirely, which a deployment whose server name nothing resolves has to do
# (deploy/README.md).
federation:
  destination_min_retry_interval: 1s
  destination_retry_multiplier: 2
  destination_max_retry_interval: 10s
__FEDERATION_WHITELIST__
# <<< vodle deployment settings
